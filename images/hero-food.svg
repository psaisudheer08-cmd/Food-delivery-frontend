<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#c2410c" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGrad)" rx="24" />
  
  <!-- Outer decorative circles -->
  <circle cx="400" cy="300" r="240" fill="#ffedd5" opacity="0.6" />
  <circle cx="400" cy="300" r="190" fill="#fed7aa" opacity="0.7" />
  <circle cx="400" cy="300" r="150" fill="url(#plateGrad)" filter="url(#heroShadow)" />

  <!-- Main Feast Artwork -->
  <text x="400" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="110" text-anchor="middle" dominant-baseline="middle">🍕</text>
  
  <!-- Floating satellite food badges -->
  <g filter="url(#heroShadow)">
    <circle cx="210" cy="180" r="55" fill="#ffffff" />
    <text x="210" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="48" text-anchor="middle" dominant-baseline="middle">🍔</text>
  </g>

  <g filter="url(#heroShadow)">
    <circle cx="590" cy="190" r="55" fill="#ffffff" />
    <text x="590" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="48" text-anchor="middle" dominant-baseline="middle">🍛</text>
  </g>

  <g filter="url(#heroShadow)">
    <circle cx="230" cy="420" r="50" fill="#ffffff" />
    <text x="230" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="42" text-anchor="middle" dominant-baseline="middle">🍜</text>
  </g>

  <g filter="url(#heroShadow)">
    <circle cx="580" cy="410" r="50" fill="#ffffff" />
    <text x="580" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="42" text-anchor="middle" dominant-baseline="middle">🥤</text>
  </g>

  <!-- Banner badge -->
  <rect x="250" y="505" width="300" height="46" rx="23" fill="#ea580c" />
  <text x="400" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Fresh &amp; Fast Delivery</text>
</svg>